# generated by scripts/gen-ci.mjs from scripts/ci-matrix.json - do not edit
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            runs_on: ubuntu-latest
            node: 20
          - name: ubuntu
            runs_on: ubuntu-latest
            node: 22
          - name: windows
            runs_on: windows-latest
            node: 20
          - name: windows
            runs_on: windows-latest
            node: 22
          - name: macos
            runs_on: macos-latest
            node: 20
          - name: macos
            runs_on: macos-latest
            node: 22
    runs-on: ${{ matrix.runs_on }}
    env:
      CLIWORKER_RESULTS_DIR: ${{ github.workspace }}/test-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}-node${{ matrix.node }}
          path: |
            test-results/files-executed.json
            test-results/skips.jsonl
          if-no-files-found: warn
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run perf
