<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLIWorker · DSH 插件界面设计</title>
<style>
  :root{
    --blue:#58a6ff; --green:#3fb950; --yellow:#d29922; --red:#f85149;
    --purple:#a371f7; --orange:#db6d28;
    --blue-soft:rgba(88,166,255,.14); --green-soft:rgba(63,185,80,.12);
    --yellow-soft:rgba(210,153,34,.12); --red-soft:rgba(248,81,73,.12);
    --orange-soft:rgba(219,109,40,.14);
    --shadow:none; --rail-w:52px; --radius:10px;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e1116; --rail:#0b0f14; --top:#0b0f14; --panel:#161b22; --panel2:#1c2128;
    --sunken:#0b0e13; --border:#30363d; --border-strong:#484f58;
    --text:#e6edf3; --muted:#8b949e; --hover:rgba(255,255,255,.04);
    --scrim:rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#f3f5f7; --rail:#ffffff; --top:#ffffff; --panel:#ffffff; --panel2:#f6f8fa;
    --sunken:#eef1f4; --border:#d0d7de; --border-strong:#afb8c1;
    --text:#1f2328; --muted:#656d76; --hover:rgba(31,35,40,.04);
    --scrim:rgba(31,35,40,.28);
    --blue:#0969da; --green:#1a7f37; --yellow:#9a6700; --red:#cf222e;
    --purple:#8250df; --orange:#bc4c00;
    --blue-soft:rgba(9,105,218,.10); --green-soft:rgba(26,127,55,.10);
    --yellow-soft:rgba(154,103,0,.10); --red-soft:rgba(207,34,46,.08);
    --orange-soft:rgba(188,76,0,.10);
    --shadow:0 1px 2px rgba(31,35,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.5 var(--sans)}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  [hidden]{display:none !important}
  svg{display:block}
  .shell{display:flex;height:100vh;min-width:0}
  .rail{width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
  .rail button{width:36px;height:36px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;position:relative}
  .rail button:hover{background:var(--hover);color:var(--text)}
  .rail button.on{background:var(--blue-soft);color:var(--blue);border-color:transparent}
  .rail button.on:before{content:"";position:absolute;left:-8px;width:2px;height:16px;border-radius:2px;background:var(--blue)}
  .rail .sp{flex:1}
  .plugin{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--top);flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:.01em;white-space:nowrap}
  .brand b{color:var(--blue);font-weight:700}
  .lamp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:3px 9px;color:var(--muted);white-space:nowrap}
  .lamp.on{border-color:rgba(210,153,34,.45);color:var(--yellow)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.ok{background:var(--green)} .dot.warn{background:var(--yellow)} .dot.bad{background:var(--red)} .dot.run{background:var(--blue)}
  .grow{flex:1}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
  .seg button{border:0;background:transparent;color:var(--muted);padding:4px 8px}
  .seg button.on{background:var(--blue-soft);color:var(--text)}
  .icon{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:4px 8px;color:var(--muted)}
  .icon:hover,.btn:hover{border-color:var(--border-strong);color:var(--text)}
  .tabs{display:flex;gap:0;padding:0 10px;border-bottom:1px solid var(--border);background:var(--top);overflow:auto}
  .tab{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.on{color:var(--text);border-bottom-color:var(--blue)}
  .page{flex:1;min-height:0;overflow:auto;padding:14px 16px 28px}
  .sub{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:700}
  h3{font-size:13px;margin:0}
  .sub .hint,.hint{color:var(--muted);font-size:12px}
  .banner{display:flex;gap:10px;align-items:center;padding:8px 12px;margin-bottom:12px;border:1px solid rgba(210,153,34,.45);background:var(--yellow-soft);border-radius:8px;flex-wrap:wrap}
  .widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
  .card.span2{grid-column:span 2}
  .card.heady{padding:12px 12px 10px}
  .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ch h3{font-weight:650}
  .kicker{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin-bottom:12px;border:1px dashed var(--border-strong);border-radius:8px;background:var(--panel)}
  .home-edit{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:12px;align-items:start}
  .library{position:sticky;top:0}
  .lib-item{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--border)}
  .lib-item:first-of-type{border-top:0}
  .card.editing{outline:1px dashed var(--border-strong)}
  .card.drop{outline:2px solid var(--blue)}
  .tools{margin-left:auto;display:flex;gap:4px}
  .mini{border:1px solid var(--border);background:var(--panel2);border-radius:6px;padding:1px 6px;color:var(--muted);font-size:12px}
  .mini:hover{color:var(--text);border-color:var(--border-strong)}
  .handle{cursor:grab;color:var(--muted);user-select:none;padding:0 2px}
  .poolgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
  .pool{border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel2);min-width:0}
  .pool .nm{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin:6px 0}
  .bar > i{display:block;height:100%;background:var(--blue);width:0}
  .bar.ok > i{background:var(--green)} .bar.low_reserve > i{background:var(--yellow)}
  .bar.critical > i,.bar.exhausted > i{background:var(--red)}
  .bar.none{background:repeating-linear-gradient(90deg,var(--border),var(--border) 4px,transparent 4px,transparent 8px)}
  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .stat{border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;background:var(--panel2)}
  .stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;font-weight:650}
  .stat span{color:var(--muted);font-size:11px}
  .okc{color:var(--green)} .lowc{color:var(--yellow)} .critc{color:var(--orange)} .badc{color:var(--red)} .mutc{color:var(--muted)}
  .rowlist{display:flex;flex-direction:column}
  .rowitem{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--border);background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;border-radius:0}
  .rowitem:first-child{border-top:0}
  .rowitem:hover{background:var(--hover)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11px;background:var(--panel2);position:sticky;top:0;z-index:1}
  tr:last-child td{border-bottom:0}
  tr.active td{background:var(--blue-soft)}
  tbody tr:hover td{background:var(--hover)}
  #model-body tr{cursor:pointer}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .wrap{white-space:normal}
  .tablewrap{border:1px solid var(--border);border-radius:10px;overflow:auto;background:var(--panel);max-height:calc(100vh - 210px)}
  .tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:6px;padding:0 6px;font-size:11px;color:var(--muted);white-space:nowrap}
  .tag.green{color:var(--green);border-color:rgba(63,185,80,.4);background:var(--green-soft)}
  .tag.yellow{color:var(--yellow);border-color:rgba(210,153,34,.45);background:var(--yellow-soft)}
  .tag.red{color:var(--red);border-color:rgba(248,81,73,.45);background:var(--red-soft)}
  .tag.blue{color:var(--blue);border-color:rgba(88,166,255,.4);background:var(--blue-soft)}
  .tag.orange{color:var(--orange);border-color:rgba(219,109,40,.45);background:var(--orange-soft)}
  .tag.purple{color:var(--purple);border-color:rgba(163,113,247,.4)}
  .unknown{color:var(--muted);font-style:italic}
  .mono{font-family:var(--mono);font-size:11.5px}
  .btn{border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:5px 10px;color:var(--text)}
  .btn.primary{border-color:rgba(88,166,255,.55);background:var(--blue-soft);color:var(--text)}
  .btn.good{border-color:rgba(63,185,80,.5);background:var(--green-soft)}
  .btn.warn{border-color:rgba(210,153,34,.5);background:var(--yellow-soft)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .linkish{border:0;background:transparent;padding:0;text-align:left;font-weight:700;color:inherit}
  .linkish:hover{color:var(--blue)}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .filters input[type=search],.filters select,.field input,.field select,.inline input,.inline select{
    background:var(--sunken);border:1px solid var(--border);border-radius:8px;padding:5px 8px;color:var(--text)
  }
  .filters input[type=search]{min-width:200px}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:transparent;border-radius:999px;padding:3px 8px;color:var(--muted)}
  .chip.on{background:var(--blue-soft);border-color:rgba(88,166,255,.45);color:var(--text)}
  .switch{width:32px;height:18px;border-radius:99px;border:1px solid var(--border);background:var(--sunken);position:relative;padding:0;flex:0 0 auto}
  .switch i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted)}
  .switch[aria-checked="true"]{background:var(--green-soft);border-color:var(--green)}
  .switch[aria-checked="true"] i{left:16px;background:var(--green)}
  .switch:disabled{opacity:.4;cursor:not-allowed}
  .scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
  .drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--border);z-index:21;overflow:auto;padding:14px 16px 24px;box-shadow:var(--shadow)}
  .kv{display:grid;grid-template-columns:108px 1fr;gap:6px 10px;font-size:12px}
  .kv .k{color:var(--muted)}
  .callout{border:1px solid var(--border);border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:8px;padding:8px 10px;color:var(--text);margin:8px 0}
  .callout.warn{border-left-color:var(--yellow);background:var(--yellow-soft)}
  .callout.bad{border-left-color:var(--red);background:var(--red-soft)}
  .set{display:grid;grid-template-columns:188px minmax(0,640px);gap:18px;align-items:start}
  .setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
  .setnav button{text-align:left;border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:8px}
  .setnav button.on{background:var(--blue-soft);color:var(--text)}
  .field{display:flex;flex-direction:column;gap:4px;margin:0 0 14px}
  .field b{font-weight:600}
  .choice{display:grid;grid-template-columns:16px 1fr;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
  .choice:has(input:checked){border-color:rgba(88,166,255,.55);background:var(--blue-soft)}
  .dur{display:flex;gap:6px}
  .dur input{width:100px}
  .listline{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border)}
  .savebar{position:sticky;bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--border);background:var(--panel);border-radius:10px;margin-top:8px;box-shadow:var(--shadow)}
  .split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:12px;align-items:start}
  .split.rev{grid-template-columns:minmax(0,1fr) minmax(300px,420px)}
  .intake-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-top:1px solid var(--border);width:100%}
  .intake-row.on{background:var(--blue-soft)}
  .igroup{margin-bottom:12px}
  .pre{margin:0;padding:10px;background:var(--sunken);border:1px solid var(--border);border-radius:8px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.45;white-space:pre-wrap}
  .toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:40}
  .toast{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;box-shadow:var(--shadow);max-width:360px}
  .modal{position:absolute;z-index:30;left:50%;top:12%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px 16px;box-shadow:var(--shadow)}
  .checks label{display:flex;gap:6px;align-items:center;margin:3px 0}
  .inline{display:flex;gap:6px;align-items:center}
  .empty{padding:28px 10px;text-align:center;color:var(--muted)}
  .meter{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--blue)}
  @media(max-width:980px){
    .widgets,.home-edit,.set,.split{grid-template-columns:1fr}
    .card.span2{grid-column:auto}
    .stats{grid-template-columns:repeat(3,1fr)}
    .rail{display:none}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>

function filteredModels(){

  return models.filter(x => {
    if (state.level!=='all' && x.level!==state.level) return false;

    if (state.avail==='stale' && !x.stale) return false;
    if (state.avail!=='all' && state.avail!=='stale' && x.avail!==state.avail) return false;
    if (!q) return true;

function blankDraft(vendor){
  return {level:'', group:'', aliases:'', vendor:vendor||'', ctx:'', readonly:'', stdin:'', pin:'', pout:'', allowed:false, deprecated:false, depReason:'', replace:''};
}
function draftFromModel(x){
  return {
    level:x.level||'', group:x.group||'', aliases:(x.aliases||[]).join(', '), vendor:x.vendor||'',
    ctx:x.ctx==null?'':String(x.ctx), readonly:x.readonly==null?'':(x.readonly?'yes':'no'),
    stdin:x.stdin==null?'':(x.stdin?'yes':'no'), pin:x.pin==null?'':String(x.pin), pout:x.pout==null?'':String(x.pout),
    allowed:!!x.allowed, deprecated:!!x.deprecated, depReason:x.depReason||'', replace:x.replace||''
  };
}
function ensureFetched(){
  if (intake){ state.fetched = true; return; }
  intake = DISCOVERED.map(g => ({
    cli:g.cli, status:g.status, via:g.via, note:g.note,
    items:(g.rows||[]).map(([id, catalogKey, vendor]) => {
      const linked = catalogKey && modelBy(catalogKey);
      return {
        uid:g.cli+'::'+id, id, cli:g.cli, via:g.via, vendor:vendor||'',
        catalogKey: linked ? catalogKey : null,
        draft: linked ? draftFromModel(linked) : blankDraft(vendor||'')
      };
    })
  }));
  state.fetched = true;
}
function intakeItems(){ return intake ? intake.flatMap(g => g.items) : []; }
function findIntake(uid){ return intakeItems().find(it => it.uid===uid) || null; }
function tri(v){ return v==='' ? null : v==='yes'; }
function numOrNull(v){ return v==='' ? null : Number(v); }
function commitIntake(item){
  const d = item.draft;
  if (!d.level) return '先选档位，再写入目录';
  if (d.deprecated && !d.depReason.trim()) return '弃用要写原因';
  const pin = numOrNull(d.pin), pout = numOrNull(d.pout);
  if ((pin===null) !== (pout===null)) return '输入价和输出价一起填，或都留空';
  if (pin!==null && (Number.isNaN(pin) || pin<0 || Number.isNaN(pout) || pout<0)) return '价格要是非负数字';
  const ctx = numOrNull(d.ctx);
  if (ctx!==null && (!Number.isInteger(ctx) || ctx<0)) return '上下文要是非负整数';
  const aliases = d.aliases.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const readonly = tri(d.readonly);
  const stdin = tri(d.stdin);
  let x = item.catalogKey ? modelBy(item.catalogKey) : null;
  if (!x){
    if (modelBy(item.id)) return '目录里已经有 '+item.id;
    x = {
      key:item.id, cli:item.cli, vendor:d.vendor||'', group:d.group||'', level:d.level,
      allowed:d.deprecated?false:!!d.allowed, avail:d.deprecated?'deprecated':'discovered', availReason:null,
      identity:'unverified', readonly, stdin, ctx, pin, pout, deprecated:!!d.deprecated, depReason:d.depReason, replace:d.replace,
      pool:null, frac:null, reset:null, remainLabel:null, probe:null, probeState:'never', probeErr:'', stale:false, used:null,
      risk:'unknown', tasks:null, basis:'none', conf:'none', samples:0, burn:null, eta:null, exhausts:null, reason:'no_samples', aliases
    };
    models.push(x);
    item.catalogKey = x.key;
  } else {
    x.level = d.level;
    x.group = d.group;
    x.vendor = d.vendor || x.vendor;
    x.aliases = aliases;
    x.ctx = ctx;
    x.pin = pin;
    x.pout = pout;
    x.readonly = readonly;
    x.stdin = stdin;
    x.deprecated = !!d.deprecated;
    x.depReason = d.depReason;
    x.replace = d.replace;
    x.allowed = d.deprecated ? false : !!d.allowed;
    if (d.deprecated) x.avail = 'deprecated';
  }
  return '';
}

function runSelect(){
  const req = state.req;
  const rejected = [];
  const notes = [];
  let pool = models.filter(x => x.level === req.level);
  const other = models.filter(x => x.level && x.level !== req.level && !x.deprecated).length;
  notes.push(`其他档位 ${other} 个模型没有进入候选，也没有用来补齐名额。`);
  function reject(list, reason){
    for (const x of list) rejected.push({key:x.key, reason});
  }
  const ex = new Set(req.exclude);
  reject(pool.filter(x => ex.has(x.key)), 'excluded');
  pool = pool.filter(x => !ex.has(x.key));
  reject(pool.filter(x => x.deprecated), 'E_MODEL_DEPRECATED');
  pool = pool.filter(x => !x.deprecated);
  reject(pool.filter(x => !x.allowed), 'not_allowed');
  pool = pool.filter(x => x.allowed);
  reject(pool.filter(x => x.stale), 'availability_stale');
  pool = pool.filter(x => !x.stale);
  reject(pool.filter(x => x.avail==='blocked' && x.availReason==='auth'), 'E_PROVIDER_AUTH');
  reject(pool.filter(x => x.avail==='blocked' && x.availReason!=='auth'), 'E_PROVIDER_QUOTA');
  reject(pool.filter(x => x.avail==='unavailable'), 'E_PROVIDER_UNAVAILABLE');
  reject(pool.filter(x => x.avail==='discovered'), 'E_PROVIDER_UNAVAILABLE');
  pool = pool.filter(x => x.avail==='callable');
  reject(pool.filter(x => x.identity==='failed'), 'E_IDENTITY_UNVERIFIED');
  pool = pool.filter(x => x.identity!=='failed');
  if (req.identity==='observed' || req.identity==='verified'){
    const need = ID_RANK[req.identity];
    reject(pool.filter(x => ID_RANK[x.identity] < need), 'E_IDENTITY_UNVERIFIED');
    pool = pool.filter(x => ID_RANK[x.identity] >= need);
  }
  if (req.require_readonly){
    reject(pool.filter(x => !x.readonly), 'E_READONLY_UNAVAILABLE');
    pool = pool.filter(x => x.readonly);
  }
  if (req.usage==='Heavy'){
    reject(pool.filter(x => ['critical','exhausted','low_reserve'].includes(x.risk)), 'E_FORECAST_EXHAUSTION');
    pool = pool.filter(x => !['critical','exhausted','low_reserve'].includes(x.risk));
  }
  if (committed.unknown_policy==='reject'){
    reject(pool.filter(x => x.risk==='unknown'), 'quota_unknown_policy');
    pool = pool.filter(x => x.risk!=='unknown');
    notes.push('未知额度策略是 reject：risk = unknown 的模型被拒绝。');
  } else {
    notes.push('未知额度策略是 after_known：未知模型排在算得清的模型后面，仍然可以被选中。');
  }
  const known = pool.filter(x => x.risk!=='unknown');
  const unknown = pool.filter(x => x.risk==='unknown');
  const byTasks = (a,b) => (b.tasks??-1) - (a.tasks??-1) || (a.pin??99) - (b.pin??99);
  const byPrice = (a,b) => (a.pin??99) - (b.pin??99) || (b.tasks??-1) - (a.tasks??-1);
  known.sort(req.usage==='Light' ? byPrice : byTasks);
  unknown.sort(req.usage==='Light' ? byPrice : byTasks);
  const ordered = known.concat(unknown);
  const picked = ordered.slice(0, req.count);
  const rest = ordered.slice(req.count);
  const warnings = [];
  if (req.role.trim()) warnings.push({code:'W_FIELD_IGNORED', field:'role'});
  if (picked.some(x => x.stale)) warnings.push({code:'W_STALE_DATA'});
  state.selection = {
    level:req.level, usage:req.usage, count:req.count, importance:req.importance,
    picked, rest, rejected, notes, warnings,
    truncated: picked.length < req.count,
    shortfall: Math.max(0, req.count - picked.length)
  };
}

function durField(key, label, hint){
  const unit = units[key];
  const div = unit==='h'?3600:unit==='m'?60:1;
  const shown = Math.round((draft[key]/div)*100)/100;
  return `<label class="field"><b>${label}</b><span class="mono hint">${key}</span>
    <span class="dur"><input type="number" min="0" step="1" data-field="${key}" value="${shown}" /><select data-act="unit" data-id="${key}">
      <option value="m" ${unit==='m'?'selected':''}>分钟</option>
      <option value="h" ${unit==='h'?'selected':''}>小时</option>
      <option value="s" ${unit==='s'?'selected':''}>秒</option>
    </select></span><span class="hint">${hint}</span></label>`;
}
function settingsInvalid(){
  if (!draft.state_dir.trim()) return '状态目录不能为空';
  for (const s of draft.secrets){
    if (!s.name.trim()) return '凭据名称不能为空';
    if (!/^[a-z]+:.+$/.test(s.ref)) return '凭据引用要像 env:NAME 或 vault:path';
  }
  for (const k of ['Heavy','Normal','Light']) if (!(draft.est[k] >= 0)) return '用量估计不能是负数';
  return '';
}

        <input id="sec-name" placeholder="名称，如 deepseek" value="${esc(state.addSecretName)}" />
        <input id="sec-ref" placeholder="env:DEEPSEEK_API_KEY" value="${esc(state.addSecretRef)}" />
        <button class="btn" type="button" data-act="add-secret">添加引用</button>
      </div>`;
  } else {
    body = `<h1>外观</h1><p class="hint">颜色立即生效，不写入 CLIWorker 配置。深浅两套用同一套间距、字号和状态色，好跟 DSH 的深色驾驶舱对齐，浅色只是把底板反过来。</p>
      <div class="field"><b>主题</b><div class="seg" role="group" aria-label="主题">
        ${[['system','跟随系统'],['dark','深色'],['light','浅色']].map(([id,l]) => `<button type="button" class="${state.themeMode===id?'on':''}" data-act="theme" data-id="${id}">${l}</button>`).join('')}
      </div></div>
      <div class="field"><b>监控主页</b><div class="hint">模块布局存在浏览器本地，键名 cw-layout。换电脑不会跟着配置走。</div>
        <button class="btn" type="button" data-act="reset-layout">恢复默认主页</button></div>`;
  }
  const err = settingsInvalid();
  const bar = state.setTab==='look' ? '' : `<div class="savebar" ${state.dirty?'':'hidden'}>
      <span>${err?esc(err):'有未保存的更改。试选和发现仍用上一份已保存的值。'}</span>
      <span class="inline"><button class="btn" type="button" data-act="discard">放弃</button><button class="btn primary" type="submit" ${err?'disabled':''}>保存</button></span>
    </div>`;
  return `<form id="settings-form"><div class="set"><nav class="setnav" aria-label="设置分区">${tabs.map(([id,l]) => `<button type="button" class="${state.setTab===id?'on':''}" data-act="set-tab" data-id="${id}">${l}</button>`).join('')}</nav><div>${body}${bar}</div></div></form>`;
}

function healthPop(){
  if (!state.health) return '';
  return `<div class="scrim" data-act="close-health"></div><div class="modal" role="dialog" aria-label="健康">
    <div class="ch"><h1 style="font-size:16px">健康</h1><span class="grow"></span><button class="icon" data-act="close-health">关闭</button></div>
    <div class="kv">
      <div class="k">进程</div><div><span class="tag yellow">需要处理</span> codex 未登录，其余渠道在。</div>
      <div class="k">配置</div><div class="mono">cliworker.config/v2</div>
      <div class="k">状态目录</div><div class="mono">${esc(committed.state_dir)}</div>
      <div class="k">只读路由</div><div class="mono">GET /cliworker/health · providers · models · forecast</div>
      <div class="k">写路由</div><div class="mono">POST /cliworker/select · usage</div>
      <div class="k">管理页</div><div>只接受 loopback。伪造的 Host / Origin 返回 E_LOOPBACK_ONLY。</div>
    </div>
    <div class="hint">插件不写 .collab，也不读取 AgentLine 的任务状态。</div>
  </div>`;
}
function aboutPop(){
  if (!state.about) return '';
  return `<div class="scrim" data-act="close-about"></div><div class="modal" role="dialog" aria-label="说明">
    <div class="ch"><h1 style="font-size:16px">这张设计稿</h1><span class="grow"></span><button class="icon" data-act="close-about">关闭</button></div>
    <p>静态页面，数据来自 CLIWorker 的示例配置和契约字段。不连接 CLI，不写 config.json。</p>
    <p><b>监控</b>是可编排的主页。额度、待处理、风险、预测、租约、用量、渠道默认打开；费用、最近选模、身份在模块库里，勾上才出现。</p>
    <p><b>模型</b>管白名单、四档、可用性、身份、余量、重置、探测、价格、弃用和最近使用。缺失写 unknown。探测失败可以重试，结果仍然是失败。</p>
    <p><b>收录</b>向每个在线渠道要一份模型清单，再手工选档位、身份组、别名、上下文、只读和价格。没选的字段保持 unknown，新模型不会自动进白名单，也不会顺便探测。</p>
    <p><b>渠道 / 额度 / 用量</b>分开，避免把策略数字和日常查看堆在一页。<b>试选</b>按档位过滤，名额不够就 truncated。<b>设置</b>用左侧分区：常规、发现、策略、凭据、外观。凭据只有引用。</p>
    <p class="hint">深色对齐 DSH 插件现在的驾驶舱：13px、#0e1116 底板、细边框、蓝绿黄红状态。浅色是同一套结构。</p>
  </div>`;
}

function shell(){
  const tabs = [['home','监控'],['models','模型'],['intake','收录'],['providers','渠道'],['pools','额度'],['usage','用量'],['select','试选'],['settings','设置']];
  const page = {home:pageHome, models:pageModels, intake:pageIntake, providers:pageProviders, pools:pagePools, usage:pageUsage, select:pageSelect, settings:pageSettings}[state.page]() ;
  const modes = [['system','跟随'],['dark','深'],['light','浅']];
  return `<div class="shell">
    <aside class="rail" aria-label="DSH">
      <button title="对话">${icon('chat')}</button>
      <button title="文件">${icon('files')}</button>
      <button title="终端">${icon('term')}</button>
      <button title="AgentLine">${icon('flow')}</button>
      <button class="on" title="CLIWorker">${icon('stack')}</button>
      <div class="sp"></div>
      <button title="DSH 设置">${icon('gear')}</button>
    </aside>
    <div class="plugin">
      <header class="top">
        <div class="brand">CLI<b>Worker</b></div>
        <button class="lamp on" data-act="health"><i class="dot warn"></i>需要处理</button>
        <span class="hint">模型层 · 独立于 AgentLine 流程</span>
        <span class="grow"></span>
        <div class="seg" role="group" aria-label="主题">${modes.map(([id,l]) => `<button class="${state.themeMode===id?'on':''}" data-act="theme" data-id="${id}">${l}</button>`).join('')}</div>
        <button class="icon" data-act="refresh" title="用夹具刷新">↻</button>
        <button class="icon" data-act="about">说明</button>
      </header>
      <nav class="tabs" role="tablist">${tabs.map(([id,l]) => `<button class="tab ${state.page===id?'on':''}" data-act="go" data-page="${id}" role="tab" aria-selected="${state.page===id}">${l}</button>`).join('')}</nav>
      <div class="stage">
        <main class="page" id="page">${page}</main>
        ${state.detail && state.page==='models' ? drawer() : ''}
        ${healthPop()}
        ${aboutPop()}
      </div>
    </div>
  </div>`;
}

function render(){
  const page = document.getElementById('page');
  const y = page ? page.scrollTop : 0;
  document.getElementById('app').innerHTML = shell();
  const next = document.getElementById('page');
  if (next) next.scrollTop = y;
}
function go(page){
  state.detail = null;
  state.health = false;
  state.about = false;
  state.page = page;
  if (location.hash !== '#'+page) location.hash = page;
  render();
}
function layoutItem(id){ return state.layout.find(x => x.id===id); }
function move(id, dir){
  const i = state.layout.findIndex(x => x.id===id);
  const j = i+dir;
  if (i<0 || j<0 || j>=state.layout.length) return;
  const [row] = state.layout.splice(i,1);
  state.layout.splice(j,0,row);
  saveLayout();
  render();
}
function syncDirty(){
  state.dirty = JSON.stringify(draft) !== JSON.stringify(committed);
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for (let i=0;i<parts.length-1;i++) cur = cur[parts[i]];
  cur[parts.at(-1)] = value;
}

function onClick(e){
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  if (act==='go'){ go(t.dataset.page); return; }
  if (act==='theme'){ state.themeMode=id; try{ localStorage.setItem('cw-theme', id); }catch{} applyTheme(); render(); return; }
  if (act==='about'){ state.about=true; render(); return; }
  if (act==='close-about'){ state.about=false; render(); return; }
  if (act==='health'){ state.health=!state.health; render(); return; }
  if (act==='close-health'){ state.health=false; render(); return; }
  if (act==='refresh'){ state.refreshed=new Date().toLocaleTimeString('zh-CN',{hour12:false}); toast('已用夹具重新演算，没有请求本机 CLI'); render(); return; }
  if (act==='dismiss-banner'){ state.banner=false; render(); return; }
  if (act==='edit'){ state.editing=!state.editing; render(); return; }
  if (act==='reset-layout'){ state.layout=structuredClone(DEFAULT_LAYOUT); saveLayout(); toast('主页已恢复默认模块'); render(); return; }
  if (act==='up'){ move(id,-1); return; }
  if (act==='down'){ move(id,1); return; }
  if (act==='span'){ const it=layoutItem(id); it.span=it.span===2?1:2; saveLayout(); render(); return; }
  if (act==='hide'){ layoutItem(id).on=false; saveLayout(); render(); return; }
  if (act==='toggle-widget'){ layoutItem(id).on=t.checked; saveLayout(); render(); return; }
  if (act==='level'){ state.level=id; render(); return; }
  if (act==='only-allow'){ state.onlyAllow=t.checked; render(); return; }
  if (act==='open-model'){
    if (e.target.closest('.switch')) return;
    state.page='models';
    state.detail=id;
    if (location.hash!=='#models') location.hash='models';
    render();
    return;
  }
  if (act==='close-drawer'){ state.detail=null; render(); return; }
  if (act==='allow'){
    e.stopPropagation();
    const x=modelBy(id);
    if (!x || x.deprecated) return;
    x.allowed=!x.allowed;
    toast(x.allowed ? '已加入白名单。若还没探测成功，选模仍会拒绝。' : '已移出白名单，不再进入候选。');
    render();
    return;
  }
  if (act==='retry'){
    const x=modelBy(id);
    x.probe='刚刚';
    x.probeState='err';
    toast(x.probeErr+' 仍然失败，没有写成可调用。');
    render();
    return;
  }
  if (act==='scan'){ toast('扫描完成（夹具）。没有新的 CLI，trae 仍是 gone。'); return; }
  if (act==='manual'){ state.manual=true; render(); return; }
  if (act==='manual-cancel'){ state.manual=false; render(); return; }
  if (act==='req-level'){ state.req.level=id; render(); return; }
  if (act==='req-usage'){ state.req.usage=id; render(); return; }
  if (act==='exclude'){
    const set=new Set(state.req.exclude);
    if (t.checked) set.add(id); else set.delete(id);
    state.req.exclude=[...set];
    return;
  }
  if (act==='set-tab'){ state.setTab=id; render(); return; }
  if (act==='add-dir'){
    const v=(document.getElementById('add-dir').value||'').trim();
    if (!v) return;
    draft.extra_dirs.push(v); state.addDir=''; syncDirty(); render(); return;
  }
  if (act==='del-dir'){ draft.extra_dirs.splice(Number(id),1); syncDirty(); render(); return; }
  if (act==='add-pat'){
    const v=(document.getElementById('add-pat').value||'').trim();
    if (!v) return;
    draft.patterns.push(v); state.addPat=''; syncDirty(); render(); return;
  }
  if (act==='del-pat'){ draft.patterns.splice(Number(id),1); syncDirty(); render(); return; }
  if (act==='add-secret'){
    const name=(document.getElementById('sec-name').value||'').trim();
    const ref=(document.getElementById('sec-ref').value||'').trim();
    if (!name || !ref){ toast('名称和引用都要填'); return; }
    draft.secrets.push({name, ref});
    state.addSecretName=''; state.addSecretRef='';
    syncDirty(); render(); return;
  }
  if (act==='del-secret'){ draft.secrets.splice(Number(id),1); syncDirty(); render(); return; }
  if (act==='discard'){ draft=structuredClone(committed); state.dirty=false; toast('已放弃未保存的更改'); render(); return; }
  if (act==='fetch-models'){
    const again = !!intake;
    if (again) intake = null;
    ensureFetched();
    toast(again ? '已重新取清单（夹具）。你改过、还没保存的草稿被清掉了。' : '已向 6 个在线渠道要清单（夹具）。kimi、trae 没有问。');
    render(); return;
  }
  if (act==='only-new'){ state.intakeOnlyNew = t.checked; render(); return; }
  if (act==='pick-intake'){ state.intakePick = id; render(); return; }
  if (act==='check-intake'){
    const set = new Set(state.intakeChecks);
    if (t.checked) set.add(id); else set.delete(id);
    state.intakeChecks = [...set];
    render(); return;
  }
  if (act==='apply-batch'){
    let n = 0;
    for (const uid of state.intakeChecks){ const it = findIntake(uid); if (it){ it.draft.level = state.intakeBatch; n++; } }
    toast(n ? '档位已写进 '+n+' 条草稿，还没进目录。' : '先勾选模型');
    render(); return;
  }
  if (act==='save-checked'){
    let ok = 0, skip = 0, err = '';
    for (const uid of state.intakeChecks){
      const it = findIntake(uid);
      if (!it) continue;
      if (!it.draft.level){ skip++; continue; }
      err = commitIntake(it);
      if (err) break;
      ok++;
    }
    toast(err || ('已保存 '+ok+' 条'+(skip?'，'+skip+' 条没选档位，跳过':'')));
    render(); return;
  }
  if (act==='open-intake'){
    const first = !state.fetched;
    ensureFetched();
    if (first) toast('已向 6 个在线渠道要清单（夹具）。kimi、trae 没有问。');
    go('intake'); return;
  }
  if (act==='edit-params'){
    ensureFetched();
    const item = intakeItems().find(it => it.catalogKey===id);
    state.intakePick = item ? item.uid : null;
    if (!item) toast('这次清单里没有 '+id);
    go('intake'); return;
  }
}
function onChange(e){
  const t=e.target;
  if (t.dataset.act==='avail'){ state.avail=t.value; render(); return; }
  if (t.dataset.act==='usage-kind'){ state.usageKind=t.value; render(); return; }
  if (t.dataset.act==='set-level'){ modelBy(t.dataset.id).level=t.value; toast('档位已改成 '+t.value+'。来源仍记为 config。'); return; }
  if (t.dataset.act==='unit'){ units[t.dataset.id]=t.value; render(); return; }
  if (t.dataset.act==='batch-level'){ state.intakeBatch=t.value; return; }
  if (t.dataset.field && t.dataset.field.startsWith('draft.')){
    const item = findIntake(state.intakePick);
    if (!item) return;
    const k = t.dataset.field.slice(6);
    item.draft[k] = t.type==='checkbox' ? t.checked : t.value;
    if (k==='deprecated' && item.draft.deprecated) item.draft.allowed = false;
    render();
  }
}
function onInput(e){
  const t=e.target;
  if (t.id==='q'){
    state.q=t.value;
    const tb=document.getElementById('model-body');
    if (tb) tb.innerHTML=modelRows();
    return;
  }
  if (t.id==='add-dir'){ state.addDir=t.value; return; }
  if (t.id==='add-pat'){ state.addPat=t.value; return; }
  if (t.id==='sec-name'){ state.addSecretName=t.value; return; }
  if (t.id==='sec-ref'){ state.addSecretRef=t.value; return; }
  const field=t.dataset.field;
  if (field && field.startsWith('draft.') && t.type!=='checkbox'){
    const item = findIntake(state.intakePick);
    if (item) item.draft[field.slice(6)] = t.value;
    return;
  }
  if (!field) return;
  if (field.startsWith('req.')){
    const k=field.slice(4);
    if (k==='count') state.req.count=Math.max(1, Math.min(10, Number(t.value)||1));
    else if (k==='require_readonly') state.req.require_readonly=t.checked;
    else state.req[k]=t.type==='checkbox'?t.checked:t.value;
    return;
  }
  if (field==='reserve'){
    draft.reserve=Number(t.value);
    const lab=document.getElementById('reserve-label');
    if (lab) lab.textContent=Math.round(draft.reserve*100)+'%。字段名保留在策略里，这张稿不另解释算法。';
    syncDirty();
    const bar=document.querySelector('.savebar');
    if (bar) bar.hidden=!state.dirty;
    return;
  }
  const durKeys=['probe_ttl_s','reading_ttl_s','lease_ttl_s','session_ttl_s'];
  if (durKeys.includes(field)){
    const unit=units[field];
    const mul=unit==='h'?3600:unit==='m'?60:1;
    draft[field]=Math.round(Number(t.value)*mul);
    syncDirty();
    const bar=document.querySelector('.savebar');
    if (bar) bar.hidden=!state.dirty;
    return;
  }
  if (t.type==='checkbox' && (field==='wsl' || field==='probe_unknown')){
    draft[field]=t.checked; syncDirty(); render(); return;
  }
  if (field==='unknown_policy'){ draft.unknown_policy=t.value; syncDirty(); render(); return; }
  if (field.startsWith('est.')){
    draft.est[field.slice(4)] = Number(t.value);
    syncDirty();
    const bar=document.querySelector('.savebar');
    if (bar) bar.hidden=!state.dirty;
    return;
  }
  if (['cache_read_weight','lock_stale_ms','lock_wait_ms','lock_poll_ms'].includes(field)){
    draft[field]=Number(t.value);
  } else if (field==='state_dir' || field==='probe_schedule'){
    draft[field]=t.value;
  }
  syncDirty();
  const bar=document.querySelector('.savebar');
  if (bar){
    bar.hidden=!state.dirty;
    const err=settingsInvalid();
    const save=bar.querySelector('button.primary');
    if (save) save.disabled=!!err;
  }
}
function onSubmit(e){
  const form=e.target;
  if (form.id==='intake-form'){
    e.preventDefault();
    const item = findIntake(state.intakePick);
    if (!item) return;
    const wasNew = !item.catalogKey;
    const err = commitIntake(item);
    toast(err || (wasNew ? '已写入目录。未勾白名单，也还没探测。' : '参数已保存。level_source 记为 config。'));
    if (!err) render();
    return;
  }
  if (form.id==='select-form'){
    e.preventDefault();
    runSelect();
    render();
    return;
  }
  if (form.id==='settings-form'){
    e.preventDefault();
    const err=settingsInvalid();
    if (err){ toast(err); return; }
    committed=structuredClone(draft);
    state.dirty=false;
    toast('已保存在这张设计稿里，没有写入 config.json');
    render();
    return;
  }
  if (form.dataset.act==='manual-form'){
    e.preventDefault();
    const fd=new FormData(form);
    const id=String(fd.get('id')||'').trim();
    const path=String(fd.get('path')||'').trim();
    if (!id || !path) return;
    if (providers.some(p => p.id===id)){ toast('已经有这个渠道 id'); return; }
    providers.unshift({id, recognized:false, transport:'cli', platform:'win32', path, version:null, auth:'unknown', status:'present', last:'刚刚', readonly:null, manual:true});
    state.manual=false;
    toast('已补录 '+id+'。认证是 unknown，还没有探测。');
    render();
  }
}
function onDragStart(e){
  const card=e.target.closest('[data-wid]');
  if (!card || !state.editing) return;
  state.drag=card.dataset.wid;
  e.dataTransfer.effectAllowed='move';
}
function onDragOver(e){
  if (!state.editing || !state.drag) return;
  const card=e.target.closest('[data-wid]');
  if (!card) return;
  e.preventDefault();
  if (state.drop!==card.dataset.wid){ state.drop=card.dataset.wid; document.querySelectorAll('[data-wid]').forEach(n => n.classList.toggle('drop', n.dataset.wid===state.drop)); }
}
function onDrop(e){
  if (!state.editing || !state.drag) return;
  e.preventDefault();
  const card=e.target.closest('[data-wid]');
  const to=card?card.dataset.wid:state.drop;
  if (to && to!==state.drag){
    const from=state.layout.findIndex(x => x.id===state.drag);
    const dest=state.layout.findIndex(x => x.id===to);
    const [row]=state.layout.splice(from,1);
    state.layout.splice(dest,0,row);
    saveLayout();
  }
  state.drag=null; state.drop=null;
  render();
}

document.getElementById('app').addEventListener('click', onClick);
document.getElementById('app').addEventListener('change', onChange);
document.getElementById('app').addEventListener('input', onInput);
document.getElementById('app').addEventListener('submit', onSubmit);
document.getElementById('app').addEventListener('dragstart', onDragStart);
document.getElementById('app').addEventListener('dragover', onDragOver);
document.getElementById('app').addEventListener('drop', onDrop);
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && ['add-dir','add-pat','sec-name','sec-ref'].includes(e.target.id)){
    e.preventDefault();
    const map = {'add-dir':'add-dir','add-pat':'add-pat','sec-name':'add-secret','sec-ref':'add-secret'};
    const btn = document.querySelector(`[data-act="${map[e.target.id]}"]`);
    if (btn) btn.click();
    return;
  }
  if (e.key!=='Escape') return;
  if (state.about||state.health||state.detail){
    state.about=false; state.health=false; state.detail=null; render();
  } else if (state.editing){ state.editing=false; render(); }
});
window.addEventListener('hashchange', () => {
  const p=(location.hash||'#home').slice(1);
  if (!PAGES.includes(p) || p===state.page) return;
  state.page=p; state.detail=null; render();
});
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (state.themeMode==='system') applyTheme(); });
applyTheme();
render();
</script>
</body>
